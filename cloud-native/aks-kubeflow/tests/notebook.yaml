# The Notebook the release gate creates.
#
# This is upstream's tests/notebook.test.kubeflow-user-example.com.yaml with a
# workspace volume added. Upstream's fixture declares no volumeMounts, and the
# Jupyter Web App's list endpoint subscripts that field rather than treating it
# as optional, so listing the notebook it creates returns HTTP 500 and the gate
# can never reach PASS notebook-api. See asw101/_cloud_native_ai#27.
#
# A workspace volume is also what the Jupyter UI produces for a real notebook,
# so this exercises a more representative object than the upstream fixture.
# Revert to upstream's file once the web app treats volumeMounts as optional.
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  annotations:
    notebooks.kubeflow.org/creator: user@example.com
    notebooks.kubeflow.org/server-type: jupyter
  labels:
    access-ml-pipeline: "true"
    app: test
  name: test
  namespace: kubeflow-user-example-com
spec:
  template:
    spec:
      containers:
      - name: test
        image: ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-scipy:v1.10.0
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "0.6"
            memory: 1.2Gi
          requests:
            cpu: "0.5"
            memory: 1Gi
        volumeMounts:
        - name: workspace
          mountPath: /home/jovyan/work
      serviceAccountName: default-editor
      volumes:
      - name: workspace
        emptyDir: {}
