apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  # One replica, deliberately. oauth2-proxy holds the PKCE code_verifier and
  # CSRF state in the instance that starts a login, and this release configures
  # no shared session store. With more than one replica a callback that lands on
  # a different instance fails token exchange with
  # `invalid_grant: Invalid code_verifier`, while Dex logs the login as
  # successful. That is an intermittent, roughly even-odds login failure which
  # presents as an opaque error page. Do not scale this up without first
  # configuring shared session storage.
  replicas: 1
  template:
    spec:
      containers:
        - name: oauth2-proxy
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://kubeflow-static-validation.eastus.cloudapp.azure.com/dex
            - name: OAUTH2_PROXY_LOGIN_URL
              value: https://kubeflow-static-validation.eastus.cloudapp.azure.com/dex/auth
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://kubeflow-static-validation.eastus.cloudapp.azure.com/oauth2/callback
            - name: OAUTH2_PROXY_RELATIVE_REDIRECT_URL
              value: "false"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
